name: Import Smokey Doughs assets
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: |
          mkdir -p public/assets
          curl --fail -L 'https://d2ol7oe51mr4n9.cloudfront.net/user_2y3C6d3x66EITVj2NwalIexq0yN/a2061bb1-9378-4e9c-8e07-6c661fe7309c.webp' -o public/assets/pizza.webp
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets
          git commit -m 'Import original images' || exit 0
          git push
