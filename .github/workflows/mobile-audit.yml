name: Mobile responsive audit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/mobile-audit.mjs'
      - '.github/workflows/mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site and browser test tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build website
        run: npm run build
      - name: Check responsive pages and interactions
        run: node tests/mobile-audit.mjs
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smokey-doughs-mobile-screenshots
          path: mobile-audit-screenshots
          if-no-files-found: ignore
